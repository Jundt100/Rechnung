<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17795a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Budget">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Haushaltsbudget</title>
<style>
:root{
  --bg:#edf0f3; --panel:#ffffff; --ink:#15202b; --muted:#667585; --line:#dde3e9; --soft:#f5f7f9;
  --accent:#17795a; --accent-d:#0f5c44; --accent-bg:#e4f3ec;
  --nic:#2563c9; --nic-bg:#e8effc; --van:#d4601a; --van-bg:#fcece1;
  --ein:#f6e7b4; --steu:#fbe4d3; --red:#c0392b; --blue-chip:#dbe7fb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0f151b;--panel:#18212a;--ink:#e8eef3;--muted:#92a2b1;--line:#27333f;--soft:#1d2833;--accent:#3fbf93;--accent-d:#2ea77d;--accent-bg:#17382d;--nic:#6aa0f0;--nic-bg:#1c2b47;--van:#f19a62;--van-bg:#43291a;--ein:#4a4018;--steu:#46301f;--blue-chip:#1d3050}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.45 "Avenir Next","Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.num,.kv2,td,.amt{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}

/* Shell */
.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);padding:20px 12px 14px;display:flex;flex-direction:column;gap:2px}
.logo{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-weight:700;font-size:16px;letter-spacing:-.01em}
.logo i{width:28px;height:28px;border-radius:8px;background:linear-gradient(90deg,var(--nic) 50%,var(--van) 50%);display:inline-block}
aside.side button.nv{display:flex;align-items:center;gap:11px;padding:10px 12px;border:0;border-radius:9px;background:none;width:100%;text-align:left;color:var(--muted);font-weight:550}
aside.side button.nv .i{width:20px;text-align:center;font-size:17px}
aside.side button.nv:hover{background:var(--soft);color:var(--ink)}
aside.side button.nv.on{background:var(--accent-bg);color:var(--accent-d);font-weight:650}
.side .foot{margin-top:auto;padding:12px 10px 0;border-top:1px solid var(--line);font-size:12px;color:var(--muted);word-break:break-all}
.side .foot b{color:var(--ink);display:block;font-weight:600}
main.main{padding:22px 28px 70px;min-width:0;max-width:1320px;width:100%}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.topbar h1{font-size:24px;margin:0 auto 0 0;letter-spacing:-.02em}
.mnav{display:flex;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mnav button{border:0;background:none;padding:8px 13px;font-size:18px;color:var(--accent)}
.mnav button:hover{background:var(--soft)}
.mnav .lab{position:relative;min-width:150px;text-align:center;font-weight:650;padding:0 6px}
.mnav .lab input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 13px;border-radius:7px;color:var(--muted);font-weight:550}
.seg button.on{background:var(--ink);color:var(--panel)}
.seg button.on.nj{background:var(--nic);color:#fff}.seg button.on.vs{background:var(--van);color:#fff}
.pill{font-size:12px;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--muted);background:var(--panel)}
.pill.ok{color:var(--accent-d);border-color:var(--accent)}
.frozen{display:inline-block;font-size:11px;background:var(--blue-chip);color:var(--nic);border-radius:99px;padding:1px 9px;margin-left:8px;font-weight:600}

/* Panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.panel>h2,.panel .ph h2{font-size:15px;margin:0 0 12px;font-weight:700;letter-spacing:-.005em}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ph h2{margin:0!important}
.hint{font-size:12.5px;color:var(--muted);margin:2px 0 8px}
.dgrid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:14px;align-items:start}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start}
.two>*{min-width:0}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;border-top:3px solid var(--line)}
.kpi.ein{border-top-color:#e0b72f}.kpi.mon,.kpi.einm{border-top-color:#79b35b}.kpi.steuer{border-top-color:#ed7d31}.kpi.spar{border-top-color:var(--accent);background:var(--accent-bg)}
.kpi .kl{font-size:12.5px;color:var(--muted);font-weight:550}
.kpi .kv2{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:3px 0 2px;white-space:nowrap}
.kpi.spar .kv2{font-size:26px}
.kpi .ks{font-size:12px;color:var(--muted);white-space:nowrap}
.kpi .ks .n{color:var(--nic);font-weight:600}.kpi .ks .v{color:var(--van);font-weight:600}
.neg{color:var(--red)}

/* Ledger: Nicola | Vanessa */
table.ledger{width:100%;border-collapse:collapse}
table.ledger th{font-size:13px;padding:8px 10px;text-align:right;font-weight:700}
table.ledger th:first-child{text-align:left}
table.ledger th.n{color:var(--nic);background:var(--nic-bg);border-radius:8px 8px 0 0}
table.ledger th.v{color:var(--van);background:var(--van-bg);border-radius:8px 8px 0 0}
table.ledger td{padding:9px 10px;text-align:right;border-bottom:1px solid var(--line)}
table.ledger td:first-child{text-align:left;font-weight:550}
table.ledger td.n{background:color-mix(in srgb,var(--nic-bg) 55%,transparent)}
table.ledger td.v{background:color-mix(in srgb,var(--van-bg) 55%,transparent)}
table.ledger td.h{font-weight:650}
table.ledger tr.spar td{font-weight:700;border-bottom:0;font-size:15px}
table.ledger tr.spar td:first-child{color:var(--accent-d)}
table.ledger small{display:block;color:var(--muted);font-weight:400;font-size:11.5px}

/* Category bars */
.bars .row{display:grid;grid-template-columns:140px 1fr 84px;gap:10px;align-items:center;padding:5px 0}
.bars .track{height:9px;background:var(--soft);border-radius:5px;overflow:hidden;display:flex}
.bars .track i{display:block;height:100%}
.bars .amt{text-align:right}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Payment lists */
.pl-head{display:flex;justify-content:space-between;font-weight:700;padding:6px 0 8px;border-bottom:2px solid var(--line);margin-bottom:4px}
.pl-head.n{color:var(--nic);border-color:var(--nic)}.pl-head.v{color:var(--van);border-color:var(--van)}
.pl-cat{font-size:12.5px;color:var(--muted);font-weight:650;padding:10px 0 3px;display:flex;justify-content:space-between}
.pl{display:flex;justify-content:space-between;gap:10px;padding:5px 6px;border-radius:7px;cursor:pointer}
.pl:hover{background:var(--soft)}
.pl .num{white-space:nowrap}
.pl .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .t small{color:var(--muted);margin-left:6px;font-size:11.5px}
.pl.nolink{cursor:default}

/* Hints */
.hl{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.hl:last-child{border:0}
.hl .ic{font-size:17px;line-height:1.3}

/* Buttons & forms */
.btn{border:0;background:var(--accent);color:#fff;padding:9px 15px;border-radius:9px;font-weight:600}
.btn:hover{background:var(--accent-d)}
.btn.sec{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.btn.sec:hover{background:var(--soft)}
.btn.danger{background:var(--red)}
.btn.sm{padding:5px 10px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.actions .grow{flex:1}
.ib{border:0;background:none;padding:5px 7px;border-radius:7px;color:var(--muted);font-size:15px}
.ib:hover{background:var(--soft);color:var(--ink)}
input,select{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;min-width:0;width:100%}
input:hover,select:hover{border-color:var(--muted)}
input[type=checkbox]{width:auto}
.err{color:var(--red);font-size:13px;margin:4px 0}

/* Entries table */
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.fbar input[type=search]{max-width:240px}
.fbar select{width:auto}
.egroup{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden}
.eg-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--soft);border-bottom:1px solid var(--line);font-weight:700}
.eg-h .sum{font-weight:600;color:var(--muted);margin-right:10px}
.erow,.ehead{display:grid;grid-template-columns:minmax(150px,2.3fr) 1.05fr 1.05fr .95fr 1.1fr 1.1fr .85fr .85fr 74px;gap:8px;align-items:center;padding:5px 14px}
.ehead{font-size:12px;color:var(--muted);font-weight:650;padding-top:8px;padding-bottom:2px}
.ehead .r,.erow .num{text-align:right}
.erow{border-bottom:1px solid var(--line)}
.erow:last-of-type{border-bottom:0}
.erow input,.erow select{border-color:transparent;background:transparent;padding:6px 7px}
.erow input:hover,.erow select:hover{border-color:var(--line)}
.erow input:focus,.erow select:focus{background:var(--panel);border-color:var(--accent)}
.erow.past,.erow.future{opacity:.55}
.erow .lb{display:none}
.erow .dim{color:var(--muted)}
.erow .act{display:flex;justify-content:flex-end}
.erow .art select{font-weight:600}
.erow[data-art=Monatlich] .art select{color:var(--accent-d)}
.erow[data-art=Einmalig] .art select{color:var(--nic)}
.erow[data-art=Jährlich] .art select{color:#c2631d}
.erow[data-art=Lohn] .art select{color:#9a7a05}
.eg-add{padding:8px 14px}
.who-NJ select{color:var(--nic);font-weight:600}.who-VS select{color:var(--van);font-weight:600}

/* Löhne / Tables */
table.t{width:100%;border-collapse:collapse;font-size:13.5px}
table.t th,table.t td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-size:12px;color:var(--muted);font-weight:650}
table.t tr.cur td{background:var(--ein);font-weight:650}
table.t tr.tot td{font-weight:700;border-top:2px solid var(--line)}
table.t tr.fut td{color:var(--muted)}
.scroll{overflow-x:auto}
.lohn-row{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;align-items:center;padding:5px 8px;border-bottom:1px solid var(--line)}
.lohn-row.cur{background:var(--ein);border-radius:8px}
.lohn-row input{text-align:right}
.lohn-row input::placeholder{color:var(--muted);opacity:.75}
.lohn-head{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:10px;font-size:12px;color:var(--muted);padding:0 8px 6px;font-weight:650}
.lohn-head span:nth-child(n+2){text-align:right;padding-right:10px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:14px}
svg.chart line{stroke:var(--line)}

/* Modal */
#modal{position:fixed;inset:0;display:none;background:rgba(10,16,22,.5);z-index:50;align-items:center;justify-content:center;padding:14px}
#modal.on{display:flex}
.sheet{background:var(--panel);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px;padding:20px}
.sheet.wide{max-width:860px}
.sheet h3{margin:0 0 12px;font-size:18px}
label.f{display:block;margin-bottom:11px;font-size:12.5px;font-weight:650;color:var(--muted)}
label.f input,label.f select{display:block;margin-top:4px;font-size:15px;color:var(--ink);font-weight:400}
.two-c{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow{display:grid;grid-template-columns:2fr 1.5fr 1fr 1fr 1fr 34px;gap:6px;margin-bottom:6px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:#1b2630;color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:99}
#toast.on{opacity:.96}
.center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:20px}
.center .panel{max-width:520px;width:100%;text-align:left}
textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:10px;background:var(--soft);padding:10px;font:12px/1.4 ui-monospace,Menlo,monospace}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
code{background:var(--soft);padding:1px 5px;border-radius:5px;font-size:12px}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
.kvrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.kvrow:last-child{border:0}

/* Mobil */
@media (max-width:899px){
  .shell{display:block}
  aside.side{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:5px 6px calc(5px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30;gap:0}
  .logo,.side .foot{display:none}
  aside.side button.nv{flex-direction:column;gap:1px;padding:5px 2px;font-size:11px;justify-content:center;align-items:center;text-align:center}
  main.main{padding:14px 12px 96px}
  .topbar h1{font-size:20px;width:100%}
  .kpis{grid-template-columns:1fr 1fr}.kpi.spar{grid-column:1/-1}
  .dgrid,.two{grid-template-columns:1fr}
  .bars .row{grid-template-columns:105px 1fr 70px}
  .ehead{display:none}
  .erow{grid-template-columns:1fr 1fr;padding:10px 12px;row-gap:4px;border-bottom:1px solid var(--line)}
  .erow .c.name{grid-column:1/-1}
  .erow .lb{display:block;font-size:11px;color:var(--muted);font-weight:600;padding-left:7px}
  .erow input,.erow select{border-color:var(--line)}
  .erow .c.an,.erow .c.av{text-align:left}
  .erow .c.act{grid-column:1/-1;justify-content:flex-end}
  .frow{grid-template-columns:1fr 1fr}
  .mnav .lab{min-width:130px}
  #toast{bottom:90px}
}

.mrow{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow .m{flex:1;min-width:0}.mrow .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mrow .s{font-size:12px;color:var(--muted)}
.mrow .a{text-align:right;font-weight:650;white-space:nowrap}.mrow .a small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.mrow.off{opacity:.55}

/* Bewegung: nur als Antwort auf Aktionen (Monat/Tab wechseln, Speichern, Dialog öffnen) */
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes barup{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes flash{0%{background:var(--accent-bg)}100%{background:transparent}}
@keyframes sheetin{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.anim main.main>*{animation:rise .3s cubic-bezier(.2,.8,.2,1) both}
.anim main.main>*:nth-child(2){animation-delay:.04s}.anim main.main>*:nth-child(3){animation-delay:.08s}.anim main.main>*:nth-child(4){animation-delay:.12s}
.anim .track i{transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--r,0)*45ms + .15s)}
.anim svg.chart rect{transform-box:fill-box;transform-origin:50% 100%;animation:barup .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*25ms + .1s)}
.erow.flash{animation:flash 1.1s ease-out}
#modal.on{animation:fade .15s ease-out}
#modal.on .sheet{animation:sheetin .22s cubic-bezier(.2,.8,.2,1)}
#toast{transform:translate(-50%,10px);transition:opacity .25s,transform .25s}
#toast.on{transform:translate(-50%,0)}
.btn,.seg button,aside.side button.nv,.pl,.mrow,.ib,.mnav button{transition:background-color .15s,color .15s,border-color .15s}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* --- Rollen / Protokoll / Druck --- */
.lohn-row.one,.lohn-head.one{grid-template-columns:1.2fr 1fr}
.logrow{display:grid;grid-template-columns:78px 62px 82px minmax(0,1fr);gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.logrow:last-of-type{border-bottom:0}
.logrow .lt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.logrow .lw{font-weight:650;font-size:12px}.logrow .lw.n{color:var(--nic)}.logrow .lw.v{color:var(--van)}
.logrow .la{font-weight:600}
.logrow .lx{color:var(--muted);overflow-wrap:anywhere}
@media(max-width:620px){.logrow{grid-template-columns:70px 1fr}.logrow .la{grid-column:2}.logrow .lx{grid-column:1/-1}}
#print{display:none}
@media print{
  body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;background:#fff;font:12px/1.4 system-ui,Arial,sans-serif;padding:0}
  #print h1{font-size:20px;margin:0 0 2px}#print .sub{margin:0 0 14px;color:#555}
  #print h2{font-size:14px;margin:16px 0 6px}
  #print table{width:100%;border-collapse:collapse}
  #print th,#print td{padding:4px 6px;border-bottom:1px solid #ccc;text-align:left}
  #print .r,#print th.r{text-align:right}
  #print tr.tot td{font-weight:700;border-top:2px solid #000}
  html,body{background:#fff!important}
}

/* ================= Apple-Design: Glas, weiche Ebenen, System-Farben ================= */
:root{
  --bg:#f2f2f7; --panel:rgba(255,255,255,.72); --solid:#fff; --ink:#1c1c1e; --muted:#6e6e73; --line:rgba(60,60,67,.14); --soft:rgba(120,120,128,.1);
  --accent:#1f9d6b; --accent-d:#157a52; --accent-bg:rgba(52,199,89,.14);
  --nic:#0a84ff; --nic-bg:rgba(10,132,255,.12); --van:#ff7a1a; --van-bg:rgba(255,149,0,.14);
  --ein:rgba(255,204,0,.2); --red:#ff3b30; --blue-chip:rgba(10,132,255,.14);
  --glass-b:rgba(255,255,255,.65); --shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(20,20,50,.07);
  --r:20px;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#0b0b0f;--panel:rgba(44,44,50,.62);--solid:#1c1c1e;--ink:#f5f5f7;--muted:#9a9aa3;--line:rgba(235,235,245,.14);--soft:rgba(235,235,245,.08);--accent:#32d583;--accent-d:#5fe0a0;--accent-bg:rgba(50,215,100,.16);--nic:#4da3ff;--nic-bg:rgba(10,132,255,.2);--van:#ff9f4a;--van-bg:rgba(255,159,10,.2);--ein:rgba(255,214,10,.16);--blue-chip:rgba(10,132,255,.22);--glass-b:rgba(255,255,255,.12);--shadow:0 1px 2px rgba(0,0,0,.3),0 12px 34px rgba(0,0,0,.35)}
}
html,body{font:15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Segoe UI",system-ui,Roboto,sans-serif;-webkit-font-smoothing:antialiased;letter-spacing:-.005em}

aside.side{background:var(--panel);-webkit-backdrop-filter:blur(30px) saturate(180%);backdrop-filter:blur(30px) saturate(180%);border-right:1px solid var(--line);padding:22px 14px 16px;gap:4px;overflow:hidden;view-transition-name:side}
.logo{padding:0 8px 22px;gap:12px;font-size:17px;font-weight:700;white-space:nowrap}

.mini .logo{padding:0 0 22px;justify-content:center}
.mini aside.side{padding-left:10px;padding-right:10px}
.mini .l{display:none!important}
.mini aside.side button.nv,.mini .collapse{justify-content:center;padding-left:0;padding-right:0}
.mini .side .foot{padding-left:0;text-align:center}

/* Kopfzeile, Steuerelemente */
main.main{padding:26px 32px 80px;max-width:1360px}
.topbar{margin-bottom:20px;gap:12px}
.topbar h1{font-size:32px;font-weight:750;letter-spacing:-.03em}
.back{border:0;background:none;color:var(--accent-d);font-weight:600;font-size:15px;padding:6px 10px 6px 0}
.topbar .back{order:-1;width:100%;text-align:left;margin-bottom:-6px}
.mnav{background:var(--panel);border:1px solid var(--glass-b);border-radius:14px;box-shadow:var(--shadow)}

.btn:hover{background:var(--accent-d)}.btn:active{transform:scale(.97)}

.eg-h{background:var(--soft);border-bottom:1px solid var(--line)}
.erow input,.erow select{background:transparent}

async function FirebaseBackend(cfg){
  const base='https://www.gstatic.com/firebasejs/10.12.2/';
  const [{initializeApp}, A, F] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
  const app = initializeApp(cfg);
  const auth = A.getAuth(app);
  let db;
  try{ db = F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()})}); }
  catch{ db = F.getFirestore(app); }
  const cache = emptyCache();
  const loaded = {};
  const emit = () => b.onData(buildS(cache, b.role));
  const ref = (col,id) => F.doc(db,'households',HOUSEHOLD,col,id);
  const clean = o => JSON.parse(JSON.stringify(o));
  let unsubs=[];
  const b = {
    mode:'firebase', user:null, role:'v', by:'',
    onAuth(cb){ A.onAuthStateChanged(auth, u => { b.user=u; b.by=u?u.email:''; b.role=(u&&u.email===ADMIN_EMAIL)?'admin':'v'; cb(u); }); },
    async signIn(){
      const p = new A.GoogleAuthProvider(); p.setCustomParameters({prompt:'select_account'});
      try{ await A.signInWithPopup(auth,p); }
      catch(e){ if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)) await A.signInWithRedirect(auth,p); else throw e; }
    },
    async signOut(){ unsubs.forEach(u=>u()); unsubs=[]; await A.signOut(auth); },
    async start(onData,onError){
      b.onData=onData;
      const adm=b.role==='admin';
      const cols = adm ? ['entries','lohn','lohnV','frozen','frozenV','settings','log'] : ['entries','lohnV','frozenV','settings'];
      for(const col of cols){
        const c = F.collection(db,'households',HOUSEHOLD,col);
        /* Regeln sind keine Filter: Vanessas Abfrage muss die erlaubte Einschränkung selbst enthalten */
        const q = col==='entries' && !adm ? F.query(c, F.where('wer','in',['VS','50/50']))
                : col==='log' ? F.query(c, F.orderBy('at','desc'), F.limit(300)) : c;
        unsubs.push(F.onSnapshot(q, snap=>{
          snap.docChanges().forEach(ch=>{ if(ch.type==='removed') delete cache[col][ch.doc.id]; else cache[col][ch.doc.id]=ch.doc.data(); });
          loaded[col]=true; emit();
          if(cols.every(c=>loaded[c])) b.onReady();
        }, err=>onError&&onError(err)));
      }
    },
    async set(col,id,obj){ await F.setDoc(ref(col,id), clean(obj)); },
    async del(col,id){ await F.deleteDoc(ref(col,id)); },
    async batch(ops){
      for(let i=0;i<ops.length;i+=400){
        const wb=F.writeBatch(db);
        ops.slice(i,i+400).forEach(op=>op.del?wb.delete(ref(op.col,op.id)):wb.set(ref(op.col,op.id),clean(op.obj)));
        await wb.commit();
      }
    },
  };
  return b;
}

const shares = (w,pv) => { if(w==='NJ') return {n:1,v:0}; if(w==='VS') return {n:0,v:1}; const p=(pv==null||pv==='')?50:Math.min(100,Math.max(0,+pv)); return {n:1-p/100,v:p/100}; };
const cats = () => (S.settings.kats && S.settings.kats.length) ? S.settings.kats : CATS_DEFAULT;
function isActive(e,k){
  if(e.ab==null) return false;
  const end = oneShot(e.art) ? e.ab : (e.bis==null ? Infinity : e.bis);
  return e.ab<=k && k<=end;
}
function status(e,k){
  if(e.ab==null) return 'off';
  if(isActive(e,k)) return 'on';
  const end = oneShot(e.art) ? e.ab : (e.bis==null ? Infinity : e.bis);
  return end<k ? 'past' : 'future';
}
function monthlyAmount(e){ return e.art==='Jährlich' ? e.betrag/12 : e.betrag; }
const grpOf = e => e.art==='Lohn'?'Lohn':e.art==='Ausgleich'?'Ausgleich':e.kat;
const grpName = g => g==='Lohn'?'Weitere Einnahmen':g==='Ausgleich'?'Zahlungen Nicola ↔ Vanessa':g;
function liveItems(k){
  return S.entries.filter(e=>isActive(e,k)).map(e=>{
    const m=r05(monthlyAmount(e)), s=shares(e.wer,e.pv), tr=e.art==='Ausgleich', vv=r05(m*s.v);
    return {id:e.id, art:e.art, kat:grpOf(e), name:e.name, betrag:e.betrag, wer:e.wer, pv:e.pv??null, konto:e.konto||null, zahler:e.zahler||null, von:e.von||null, n:tr?0:r05(m-vv), v:tr?0:vv};
  });
}
function lohnBase(k){
  let n=0,v=0,kn=-1,kv=-1;
  for(const [kk,o] of Object.entries(S.lohn)){
    const key=+kk; if(key>k) continue;
    if(o.n!=null && o.n!=='' && key>kn){ kn=key; n=+o.n; }
    if(o.v!=null && o.v!=='' && key>kv){ kv=key; v=+o.v; }
  }
  return {n,v};
}
function monthData(k){

  const l=lohnBase(k);

}
function calc(md){
  const z=()=>({ein:0,mon:0,ek:0,einm:0,steuer:0,spar:0,mo:0,ausg:0,ausE:0,ausA:0});
  const N=z(), V=z(), H=z(), cat={}, tr=[];
  N.ein=md.lohnN||0; V.ein=md.lohnV||0; H.ein=N.ein+V.ein;
  for(const it of md.items){
    if(it.art==='Lohn'){ N.ein+=it.n; V.ein+=it.v; H.ein+=it.n+it.v; continue; }
    if(it.art==='Ausgleich'){
      const a=r05(it.betrag); if(!a||!it.von) continue;
      const P=it.von==='VS'?V:N, R=it.von==='VS'?N:V;
      P.einm+=a; R.ein+=a; P.ausA+=a; R.ausE+=a; tr.push({name:it.name,von:it.von,amt:a,once:true}); continue;
    }
    const f = it.art==='Monatlich'?(it.konto==='einkauf'?'ek':'mon'):it.art==='Einmalig'?'einm':'steuer';
    N[f]+=it.n; V[f]+=it.v; H[f]+=it.n+it.v;
    const c=(cat[it.kat]=cat[it.kat]||{n:0,v:0}); c.n+=it.n; c.v+=it.v;
    if(it.zahler==='NJ' && it.v>0.004){ N[f]+=it.v; N.ein+=it.v; N.ausE+=it.v; V.ausA+=it.v; tr.push({name:it.name,von:'VS',amt:it.v}); }
    else if(it.zahler==='VS' && it.n>0.004){ V[f]+=it.n; V.ein+=it.n; V.ausE+=it.n; N.ausA+=it.n; tr.push({name:it.name,von:'NJ',amt:it.n}); }
  }
  for(const P of [N,V,H]){ P.mo=P.mon+P.einm; P.ausg=P.mon+P.ek+P.einm+P.steuer; P.spar=P.ein-P.ausg; }
  return {N,V,H,cat,tr};
}

      let items=liveItems(k), lohnV=l.v; const fv=S.frozenV[k];
      if(fv){ items=items.filter(i=>i.wer!=='VS').concat(fv.items.filter(i=>i.wer==='VS')); lohnV=fv.lohnV; }   // Vanessas eigener Stand bleibt massgebend
      const obj={key:k, items, lohnN:l.n, lohnV, at:Date.now()};
      S.frozen[k]=obj; ops.push({col:'frozen',id:String(k),obj});
      if(!fv) ops.push({col:'frozenV',id:String(k),obj:vView(obj)});
    } else {
      const obj={key:k, items:liveItems(k).map(i=>({...i,n:0})), lohnV:l.v, at:Date.now()};
      S.frozen[k]={...obj,lohnN:0}; ops.push({col:'frozenV',id:String(k),obj});
    }
  }
  if(ops.length) await backend.batch(ops);
}

/* ============ Diagramm ============ */
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function chart(labels, series){
  const W=640,H=200,pl=44,pr=6,pt=10,pb=24;
  const all=series.flatMap(s=>s.values);
  let max=Math.max(1,...all), min=Math.min(0,...all);
  const step=niceStep((max-min)/4||1); max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const y=v=>pt+(H-pt-pb)*(max-v)/((max-min)||1);
  const n=labels.length, gw=(W-pl-pr)/n, bw=Math.min(22,(gw-6)/series.length);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">`;
  for(let v=min; v<=max+1e-9; v+=step){
    s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-5}" y="${y(v)+3}" text-anchor="end">${Math.abs(v)>=1000?(v/1000)+'k':v}</text>`;
  }
  labels.forEach((lb,i)=>{
    const cx=pl+gw*i+gw/2;
    series.forEach((se,j)=>{
      const v=se.values[i]; const x=cx-(series.length*bw)/2+j*bw;
      const y0=y(0), y1=y(v);
      s+=`<rect x="${x}" y="${Math.min(y0,y1)}" width="${bw-1}" height="${Math.max(0.5,Math.abs(y0-y1))}" rx="2" style="--i:${i}" fill="${se.color}"><title>${esc(se.name)} ${esc(lb)}: ${chf(v)}</title></rect>`;
    });
    s+=`<text x="${cx}" y="${H-8}" text-anchor="middle">${esc(lb)}</text>`;
  });
  s+='</svg><div class="legend">'+series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')+'</div>';
  return s;
}

/* ============ Update-Prüfung ============ */
async function checkUpdate(manual){
  if(location.protocol==='file:'){ if(manual) toast('Nur auf gehosteter Seite möglich'); return; }
  try{
    const r=await fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}); const t=await r.text();
    const m=t.match(/const APP_VERSION='([^']+)'/); ui.updTs=Date.now();
    if(m && m[1]!==APP_VERSION){ ui.updAvail=true; if(autoUpd()) tryApplyUpdate(); else { render(); } }
    else { ui.updAvail=false; if(manual) toast('Du hast die neueste Version'); if(ui.tab==='admin') render(); }
  }catch{ if(manual) toast('Prüfung nicht möglich (offline?)'); }
}
function tryApplyUpdate(){
  const a=document.activeElement, busy=$('#modal.on')||(a&&a.matches&&a.matches('input,select,textarea'));
  if(busy){ clearTimeout(tryApplyUpdate.t); tryApplyUpdate.t=setTimeout(tryApplyUpdate,15000); render(); return; }
  location.reload();
}
function startUpdateLoop(){
  if(startUpdateLoop.on) return; startUpdateLoop.on=true;
  checkUpdate(false);
  setInterval(()=>checkUpdate(false),30*60*1000);
  document.addEventListener('visibilitychange',()=>{ if(!document.hidden && Date.now()-(ui.updTs||0)>10*60*1000) checkUpdate(false); });
}

function openFrozen(k){
  const base=S.frozen[k]||{items:liveItems(k),lohnN:lohnBase(k).n,lohnV:lohnBase(k).v};
  const fr=JSON.parse(JSON.stringify({items:base.items,lohnN:base.lohnN||0,lohnV:base.lohnV||0}));
  const m=$('#modal'); const allc=[...cats()];
  const draw=()=>{
    m.innerHTML=`<div class="sheet wide"><h3>${label(k)} bearbeiten <span class="frozen">🔒 eingefroren</span></h3>
    <div class="hint">Änderungen gelten nur für diesen Monat. Die laufenden Einträge bleiben unverändert.</div>
    <div class="two-c"><label class="f">Lohn Nicola<input type="number" step="any" data-fl="lohnN" value="${fr.lohnN}"></label><label class="f">Lohn Vanessa<input type="number" step="any" data-fl="lohnV" value="${fr.lohnV}"></label></div>
    <div>${fr.items.map((it,i)=>`<div class="frow" data-i="${i}">
      <input data-ff="name" value="${esc(it.name)}" placeholder="Beschreibung">
      <select data-ff="kat">${[...new Set([...allc,it.kat])].map(c=>`<option ${it.kat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
      <select data-ff="art">${ART_OPT.map(([v,l])=>`<option value="${v}" ${artSel(it)===v?'selected':''}>${l}</option>`).join('')}</select>
      <input data-ff="betrag" type="number" step="any" value="${it.betrag}" style="text-align:right">
      <select data-ff="wer">${WER_OPT.map(([v,l])=>`<option value="${v}" ${it.wer===v?'selected':''}>${l}</option>`).join('')}</select>
      <button class="ib" type="button" data-fdel="${i}">🗑</button></div>`).join('')}</div>
    <div class="actions"><button class="btn sec sm" type="button" data-fadd>＋ Zeile</button></div>
    <div class="actions" style="margin-top:14px"><button class="btn grow" type="button" data-fsave>Speichern</button><button class="btn sec" type="button" data-close>Abbrechen</button></div>
    <div class="actions" style="margin-top:12px;border-top:1px solid var(--line);padding-top:12px"><button class="btn sec sm" type="button" data-funlock>Entsperren (wieder live berechnen)</button></div></div>`;
    m.classList.add('on');
    const sync=()=>{
      m.querySelectorAll('[data-fl]').forEach(i=>fr[i.dataset.fl]=r05(parseFloat(i.value)));
      m.querySelectorAll('.frow').forEach(r=>{const it=fr.items[+r.dataset.i]; r.querySelectorAll('[data-ff]').forEach(i=>{const f=i.dataset.ff; if(f==='art'&&i.value.startsWith('Ausgleich:')){ it.art='Ausgleich'; it.von=i.value.split(':')[1]; } else it[f]=f==='betrag'?r05(parseFloat(i.value)):i.value;});});
    };
    m.querySelectorAll('[data-fdel]').forEach(b=>b.onclick=()=>{ sync(); fr.items.splice(+b.dataset.fdel,1); draw(); });
    $('[data-fadd]',m).onclick=()=>{ sync(); fr.items.push({id:null,art:'Einmalig',kat:allc[0],name:'',betrag:0,wer:'50/50',konto:null,zahler:null}); draw(); };
    $('[data-close]',m).onclick=closeModal;
    $('[data-fsave]',m).onclick=async()=>{
      sync();
      const items=fr.items.map(it=>{ const mm=r05(it.art==='Jährlich'?it.betrag/12:it.betrag), s=shares(it.wer,it.pv), t=it.art==='Ausgleich', vv=r05(mm*s.v); return {...it,id:it.id||null,art:it.art,kat:it.art==='Lohn'||t?grpOf(it):it.kat,name:it.name,betrag:it.betrag,wer:it.wer,n:t?0:r05(mm-vv),v:t?0:vv}; });
      await backend.batch(freezeOps(k,{key:k,items,lohnN:fr.lohnN,lohnV:fr.lohnV,at:Date.now()}));
      logEv('Monat bearbeitet',label(k)+' (eingefroren) von Hand angepasst');
      closeModal(); toast('Monat gespeichert');
    };
    $('[data-funlock]',m).onclick=async()=>{
      if(!confirm('Monat entsperren? Er wird dann wieder aus den laufenden Einträgen berechnet.')) return;
      await backend.set('settings','main',{...S.settings,unlocked:[...new Set([...(S.settings.unlocked||[]),k])]});
      await backend.batch([{col:'frozen',id:String(k),del:true},{col:'frozenV',id:String(k),del:true}]); logEv('Entsperrt',label(k)); closeModal(); toast('Entsperrt');
    };
  };
  draw();
}

function runCountUp(animate){
  const red=reduced();
  document.querySelectorAll('[data-cu]').forEach(el=>{
    const [k,vs]=el.dataset.cu.split('|'); const v=parseFloat(vs); const prev=ui.cu[k]; ui.cu[k]=v;
    if(!animate||red) return;
    const from=prev==null?0:prev; if(from===v) return;
    const t0=performance.now(), dur=520;
    const step=t=>{ const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3); el.textContent=chf(from+(v-from)*e); if(p<1) requestAnimationFrame(step); else el.textContent=chf(v); };
    requestAnimationFrame(step);
  });
}

async function saveEntryField(row,f,val){
  const e=S.entries.find(x=>x.id===row.dataset.eid); if(!e) return;
  const o={...e}; delete o.id;
  if(f==='betrag') o.betrag=r05(parseFloat(val));
  else if(f==='ab'){ const k=fromInput(val); if(k==null){ toast('Monat fehlt'); render(); return; } o.ab=k; }
  else if(f==='bis') o.bis=fromInput(val);
  else if(f==='art'&&String(val).startsWith('Ausgleich:')){ o.art='Ausgleich'; o.von=String(val).split(':')[1]; }
  else o[f]=val;
  if(oneShot(o.art)) o.bis=null;
  if(o.art==='Ausgleich'){ if(!isAdmin()) return; o.wer='50/50'; o.kat='Ausgleich'; o.von=o.von||'VS'; }
  else if(o.art==='Lohn') o.kat='Lohn'; else if(o.kat==='Lohn'||o.kat==='Ausgleich') o.kat=cats()[0];
  if(o.bis!=null && o.bis<o.ab){ toast('«Bis» liegt vor «Ab»'); render(); return; }
  if(!canEdit(e)) return;
  if(!isAdmin()) o.wer='VS';
  await autoFreeze();
  ui.flashId=e.id;
  await backend.set('entries',e.id,o);
  logEv('Geändert',diffText(e,o));
}

  const place=ev=>{ const t=el(), w=t.offsetWidth, h=t.offsetHeight; let x=ev.clientX+16, y=ev.clientY-h-14; if(x+w>innerWidth-8) x=ev.clientX-w-16; if(y<8) y=ev.clientY+18; t.style.transform=`translate(${x}px,${y}px)`; };
  const show=(ev,h)=>{

    t.classList.add('on'); place(ev);
  };
  const hide=()=>{ if(cur){ const svg=cur.closest('svg'); if(svg) hot(svg,cur.dataset.i,false); cur=null; } if(tip) tip.classList.remove('on'); };
  document.addEventListener('pointermove',ev=>{ const h=ev.target.closest&&ev.target.closest('svg.chart2 .hit'); if(h) show(ev,h); else if(cur) hide(); });
  document.addEventListener('pointerdown',ev=>{ const h=ev.target.closest&&ev.target.closest('svg.chart2 .hit'); if(h) show(ev,h); else hide(); });

/* ============ Diagramm (Welle / Balken) ============ */
function chart2(labels, series, mode){
  const W=640,H=230,pl=46,pr=10,pt=14,pb=26;
  const all=series.flatMap(s=>s.values);
  let max=Math.max(1,...all), min=Math.min(0,...all);
  const step=niceStep((max-min)/4||1); max=Math.ceil(max/step)*step; min=Math.floor(min/step)*step;
  const y=v=>pt+(H-pt-pb)*(max-v)/((max-min)||1);
  const n=labels.length, gw=(W-pl-pr)/n;
  const gid='g'+Math.random().toString(36).slice(2,7);
  let s=`<svg class="chart2" viewBox="0 0 ${W} ${H}" role="img">`;
  if(mode==='wave') s+='<defs>'+series.map((se,j)=>`<linearGradient id="${gid}${j}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${se.color}" stop-opacity=".28"/><stop offset="1" stop-color="${se.color}" stop-opacity="0"/></linearGradient>`).join('')+'</defs>';
  for(let v=min; v<=max+1e-9; v+=step) s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}"/><text x="${pl-7}" y="${y(v)+4}" text-anchor="end">${Math.abs(v)>=1000?(v/1000)+'k':v}</text>`;
  labels.forEach((lb,i)=>{ s+=`<text x="${pl+gw*i+gw/2}" y="${H-7}" text-anchor="middle">${esc(lb)}</text>`; });
  if(mode==='bar'){
    const bw=Math.min(18,(gw-8)/series.length);
    labels.forEach((lb,i)=>{ const cx=pl+gw*i+gw/2; s+=`<g class="col" data-i="${i}">`; series.forEach((se,j)=>{
      const v=se.values[i], x=cx-(series.length*bw)/2+j*bw, y0=y(0), y1=y(v);
      s+=`<rect class="bar" x="${x+.5}" y="${Math.min(y0,y1)}" width="${bw-1}" height="${Math.max(.5,Math.abs(y0-y1))}" rx="${Math.min(5,bw/2)}" fill="${se.color}"/>`; }); s+='</g>'; });
  } else {
    series.forEach((se,j)=>{
      const pts=se.values.map((v,i)=>[pl+gw*i+gw/2,y(v)]);
      /* monotone cubic: glatt, ohne Überschwingen */
      const dx=[],dy=[],m=[],t=[];
      for(let i=0;i<pts.length-1;i++){ dx[i]=pts[i+1][0]-pts[i][0]; dy[i]=pts[i+1][1]-pts[i][1]; m[i]=dy[i]/dx[i]; }
      t[0]=m[0]; t[pts.length-1]=m[m.length-1];
      for(let i=1;i<pts.length-1;i++) t[i]=m[i-1]*m[i]<=0?0:(m[i-1]+m[i])/2;
      let d=`M${pts[0][0]},${pts[0][1]}`;
      for(let i=0;i<pts.length-1;i++){ const h=dx[i]/3; d+=` C${pts[i][0]+h},${pts[i][1]+t[i]*h} ${pts[i+1][0]-h},${pts[i+1][1]-t[i+1]*h} ${pts[i+1][0]},${pts[i+1][1]}`; }
      const last=pts[pts.length-1], first=pts[0], base=y(Math.max(0,min));
      s+=`<path d="${d} L${last[0]},${base} L${first[0]},${base} Z" fill="url(#${gid}${j})" class="area"/><path d="${d}" fill="none" stroke="${se.color}" stroke-width="2.6" stroke-linecap="round" class="ln"/>`;
      pts.forEach((p,i)=>{ s+=`<circle class="dot" data-i="${i}" cx="${p[0]}" cy="${p[1]}" r="3.4" fill="var(--panel)" stroke="${se.color}" stroke-width="2"/>`; });
    });
    labels.forEach((lb,i)=>{ const cx=pl+gw*i+gw/2; s+=`<line class="guide" data-i="${i}" x1="${cx}" x2="${cx}" y1="${pt}" y2="${H-pb}"/>`; });
  }
  /* unsichtbare Trefferflächen: zeigen sofort die Werte des Monats */
  labels.forEach((lb,i)=>{ const tip=encodeURIComponent(JSON.stringify({t:lb,r:series.map(se=>[se.name,se.color,se.values[i]])})); s+=`<rect class="hit" data-i="${i}" data-tip="${tip}" x="${pl+gw*i}" y="${pt}" width="${gw}" height="${H-pt-pb}" fill="transparent"/>`; });
  s+='</svg><div class="legend">'+series.map(se=>`<span><i style="background:${se.color}"></i>${esc(se.name)}</span>`).join('')+'</div>';
  return s;
}

  const start=Math.min(f==null?cur:f, cur-1), end=cur+12;
  let h=`<div class="topbar"><h1>Löhne</h1></div><div class="panel"><div class="hint" style="margin-top:0">Den Lohn trägst du in dem Monat ein, in dem er ausbezahlt wird (am 25.). Er gilt für das <b>Budget des Folgemonats</b>: der Oktober-Lohn finanziert den November. Leer = gleicher Lohn wie zuvor (grau angezeigt).${adm?'':' Eingefrorene Monate (🔒) sind gesperrt.'}</div>
  <div class="lohn-head ${adm?'':'one'}"><span>Auszahlung am 25.</span>${adm?'<span>Nicola</span>':''}<span>Vanessa</span></div>`;
  for(let k=start;k<=end;k++){
    const o=S.lohn[k]||{}, b=lohnBase(k), lock=!adm&&S.frozen[k]?'disabled':'', pm=ymOf(k-1);
    h+=`<div class="lohn-row ${adm?'':'one'} ${k===ui.key?'cur':''}"><span class="mo">${MONTHS[pm.m-1]} ${pm.y}${S.frozen[k]?' 🔒':''}<small>für ${label(k)}</small></span>
      ${adm?`<input type="number" step="any" inputmode="decimal" data-lohn="${k}" data-p="n" value="${o.n??''}" placeholder="${fmt0(b.n)}">`:''}
      <input type="number" step="any" inputmode="decimal" data-lohn="${k}" data-p="v" value="${o.v??''}" placeholder="${fmt0(b.v)}" ${lock}></div>`;
  }
  return h+`</div>`;
}

/* ============ Eintrag bearbeiten ============ */
function openEntry(id){
  const isNew=!id, adm=isAdmin();
  const e=isNew?{art:'Monatlich',kat:cats()[0],name:'',betrag:'',wer:adm?'50/50':'VS',ab:ui.key,bis:null,pv:null,konto:null,zahler:null,von:'VS'}:{...S.entries.find(x=>x.id===id)};
  if(!canEdit(e)) return;
  const m=$('#modal');
  const arts=adm?['Monatlich','Einmalig','Jährlich','Lohn','Ausgleich:VS','Ausgleich:NJ']:['Monatlich','Einmalig','Jährlich','Lohn'];
  const artL={Monatlich:'Monatlich',Einmalig:'Einmalig',Jährlich:'Jährlich (÷ 12 ans Jahreskonto)',Lohn:'Weitere Einnahme','Ausgleich:VS':'Vanessa zahlt an Nicola','Ausgleich:NJ':'Nicola zahlt an Vanessa'};
  const cur=artSel(e);
  const form=()=>`<div class="sheet"><h3>${isNew?'Neuer Eintrag':'Eintrag bearbeiten'}</h3>
  <form id="ef">
    <div class="two-c"><label class="f">Art<select name="art">${arts.map(a=>`<option value="${a}" ${cur===a?'selected':''}>${artL[a]}</option>`).join('')}</select></label>
    <label class="f" data-katwrap>Kategorie<select name="kat">${[...new Set([...cats(),e.kat].filter(Boolean))].map(c=>`<option ${e.kat===c?'selected':''}>${esc(c)}</option>`).join('')}</select></label></div>
    <label class="f">Beschreibung<input name="name" value="${esc(e.name)}" placeholder="z. B. Netflix" autocomplete="off"></label>
    <div class="two-c"><label class="f"><span data-betrag>Betrag (CHF)</span><input name="betrag" type="number" step="any" inputmode="decimal" value="${e.betrag}" required></label>
    <label class="f" data-werwrap>Wer trägt die Kosten<select name="wer">${(adm?[['NJ','Nicola'],['VS','Vanessa'],['50/50','50/50']]:[['VS','Vanessa']]).map(([v,l])=>`<option value="${v}" ${e.wer===v?'selected':''}>${l}</option>`).join('')}</select></label></div>
    ${adm?`<div class="two-c"><label class="f" data-pvwrap>Anteil Vanessa (%)<input name="pv" type="number" min="0" max="100" step="any" inputmode="decimal" value="${e.pv??50}"></label><label class="f" data-kwrap>Bezahlt über<select name="konto"><option value="">Privatkonto</option><option value="einkauf" ${e.konto==='einkauf'?'selected':''}>Einkaufskonto (Miete, Essen …)</option></select></label></div>`:''}
    <div class="two-c"><label class="f"><span data-ablab>Ab Monat</span><input name="ab" type="month" value="${toInput(e.ab)}" required></label>
    <label class="f" data-biswrap>Bis Monat (leer = läuft weiter)<input name="bis" type="month" value="${toInput(e.bis)}"></label></div>
    <div class="hint" data-hint></div><div class="err" data-err></div>
    <div class="actions"><button class="btn grow" type="submit">Speichern</button><button class="btn sec" type="button" data-close>Abbrechen</button></div>
    ${isNew?'':`<div class="actions" style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px">
      ${!oneShot(e.art)?`<button class="btn sec sm" type="button" data-end>Ab ${label(ui.key)} beenden</button><button class="btn sec sm" type="button" data-newamt>Betrag ab ${label(ui.key)} ändern</button>`:''}
      <button class="btn danger sm" type="button" data-del>Löschen</button></div>`}
  </form></div>`;
  m.innerHTML=form(); m.classList.add('on');
  const f=$('#ef');
  const parseArt=()=>{ const v=f.art.value; return v.startsWith('Ausgleich:')?{art:'Ausgleich',von:v.split(':')[1]}:{art:v}; };
  const sync=()=>{
    const {art,von}=parseArt(), tr=art==='Ausgleich', lohn=art==='Lohn';
    $('[data-katwrap]',f).style.display=(lohn||tr)?'none':'';
    $('[data-biswrap]',f).style.display=oneShot(art)?'none':'';
    $('[data-ablab]',f).textContent=oneShot(art)?'Monat':'Ab Monat';
    $('[data-betrag]',f).textContent=art==='Jährlich'?'Jahresbetrag (CHF)':'Betrag (CHF)';
    $('[data-werwrap]',f).style.display=tr?'none':'';
    if(adm){ const geteilt=f.wer.value==='50/50'&&!tr; $('[data-pvwrap]',f).style.visibility=geteilt?'':'hidden'; $('[data-kwrap]',f).style.visibility=art==='Monatlich'?'':'hidden'; $('[data-pvwrap]',f).parentNode.style.display=(tr||(!geteilt&&art!=='Monatlich'))?'none':''; }
    const ab=fromInput(f.ab.value), b=r05(parseFloat(f.betrag.value)||0); let hint='';
    if(art==='Jährlich'&&b) hint=`= ${chf(r05(b/12))} pro Monat ans Jahreskonto`;
    if(tr&&b) hint=von==='VS'?`Vanessa überweist Nicola ${chf(b)} (einmalig). Bei Nicola zählt das als zusätzliche Einnahme, bei Vanessa als Ausgabe.`:`Nicola überweist Vanessa ${chf(b)} (einmalig). Bei Vanessa zählt das als zusätzliche Einnahme, bei Nicola als Ausgabe.`;
    if(adm&&!tr&&f.wer.value==='50/50'&&b){ const p=Math.min(100,Math.max(0,parseFloat(f.pv.value)||0)); if(p!==50) hint=`Aufteilung: Vanessa ${p} %, Nicola ${100-p} %.`+(hint?' '+hint:''); }
    if(!hint && ab&&ab<nowKey()) hint='Vergangene Monate sind eingefroren und ändern sich nicht.';
    $('[data-hint]',f).textContent=hint;
  };
  f.betrag.addEventListener('change',()=>{ if(f.betrag.value!=='') f.betrag.value=r05(parseFloat(f.betrag.value)); });
  f.addEventListener('input',sync); f.addEventListener('change',sync); sync();
  $('[data-close]',f).onclick=closeModal;
  f.onsubmit=async ev=>{
    ev.preventDefault();
    const {art,von}=parseArt(), tr=art==='Ausgleich';
    const betrag=r05(parseFloat(f.betrag.value)), ab=fromInput(f.ab.value); let bis=oneShot(art)?null:fromInput(f.bis.value);
    const err=$('[data-err]',f);
    if(!(betrag>=0)||f.betrag.value===''){ err.textContent='Bitte einen Betrag eingeben.'; return; }
    if(ab==null){ err.textContent='Bitte einen Monat wählen.'; return; }
    if(bis!=null && bis<ab){ err.textContent='«Bis Monat» liegt vor «Ab Monat».'; return; }
    const obj={art, kat:(art==='Lohn'||tr)?grpOf({art}):f.kat.value, name:f.name.value.trim(), betrag, wer:tr?'50/50':f.wer.value, ab, bis};
    if(adm && art==='Monatlich' && f.konto.value) obj.konto=f.konto.value;
    if(adm && !tr && obj.wer==='50/50'){ const p=parseFloat(f.pv.value); if(!isNaN(p)&&Math.round(p*100)!==5000) obj.pv=Math.min(100,Math.max(0,p)); }
    if(tr) obj.von=von;
    if(!adm) obj.wer='VS';
    await autoFreeze();
    await backend.set('entries', e.id||uid(), obj);
    logEv(isNew?'Neu':'Geändert', isNew?entryDesc(obj):diffText(e,obj));
    closeModal(); toast('Gespeichert');
  };
  if(!isNew){
    $('[data-del]',f).onclick=async()=>{ if(!confirm(`«${e.name||'Eintrag'}» wirklich löschen?\nVergangene (eingefrorene) Monate bleiben unverändert.`)) return; await autoFreeze(); await backend.del('entries',e.id); logEv('Gelöscht',entryDesc(e)); closeModal(); toast('Gelöscht'); };
    const end=$('[data-end]',f); if(end) end.onclick=async()=>{
      if(e.ab>=ui.key){ if(!confirm('Der Eintrag beginnt erst in diesem Monat oder später. Ganz löschen?')) return; await autoFreeze(); await backend.del('entries',e.id); logEv('Gelöscht',entryDesc(e)); }
      else { await autoFreeze(); const o={...e}; delete o.id; o.bis=ui.key-1; await backend.set('entries',e.id,o); logEv('Beendet',`«${e.name}» endet nach ${label(ui.key-1)}`); }
      closeModal(); toast('Beendet');
    };
    const na=$('[data-newamt]',f); if(na) na.onclick=async()=>{
      const v=prompt(`Neuer Betrag ab ${label(ui.key)} (bisher ${fmt(e.betrag)}):`); if(v==null) return;
      const nb=r05(parseFloat(String(v).replace(',','.').replace(/[’' ]/g,''))); if(!(nb>=0)){ toast('Ungültiger Betrag'); return; }
      if(e.ab>=ui.key){ const o={...e,betrag:nb}; delete o.id; await autoFreeze(); await backend.set('entries',e.id,o); logEv('Betrag',`«${e.name}»: ${fmt(e.betrag)} → ${fmt(nb)} (gleich ab Start)`); }
      else { await autoFreeze(); const oldO={...e}; delete oldO.id; oldO.bis=ui.key-1; const newO={...oldO,betrag:nb,ab:ui.key,bis:e.bis}; await backend.batch([{col:'entries',id:e.id,obj:oldO},{col:'entries',id:uid(),obj:newO}]); logEv('Betrag',`«${e.name}»: ${fmt(e.betrag)} → ${fmt(nb)} ab ${label(ui.key)}`); }
      closeModal(); toast('Betrag geändert');
    };
  }
}
function closeModal(){ const m=$('#modal'); m.classList.remove('on'); m.innerHTML=''; }

/* ============ Aktionen ============ */
async function seedData(){
  if(!SEED){ toast('Keine Startdaten eingebaut'); return; }
  if(S.entries.length && !confirm('Startdaten zu den vorhandenen Einträgen hinzufügen?')) return;
  const ops=[]; const have=new Set(S.entries.map(e=>[e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|')));
  SEED.entries.forEach(e=>{ if(!have.has([e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|'))) ops.push({col:'entries',id:uid(),obj:e}); });
  Object.entries(SEED.lohn).forEach(([k,o])=>{ if(!S.lohn[k]) ops.push(...lohnOps(k,o)); });
  if(!ops.length){ toast('Alles schon vorhanden'); return; }
  await backend.batch(ops); logEv('Startdaten',ops.length+' Einträge geladen'); toast(ops.length+' Einträge geladen');
}
function exportData(){
  const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),entries:S.entries,lohn:S.lohn,frozen:S.frozen,settings:S.settings},null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='budget-backup-'+new Date().toISOString().slice(0,10)+'.json'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
  if(isAdmin()){ backend.set('settings','main',{...S.settings,lastBackup:Date.now()}); logEv('Backup','Datensicherung (JSON) heruntergeladen'); }
  toast('Backup gespeichert');
}
const backupAge = () => S.settings.lastBackup ? Math.floor((Date.now()-S.settings.lastBackup)/864e5) : null;
async function importData(file){
  try{
    const d=JSON.parse(await file.text()); const ops=[];
    const have=new Set(S.entries.map(e=>[e.art,e.kat,e.name,e.betrag,e.wer,e.ab].join('|')));
    (d.entries||[]).forEach(e=>{ const {id,...o}=e; if(!have.has([o.art,o.kat,o.name,o.betrag,o.wer,o.ab].join('|'))) ops.push({col:'entries',id:id||uid(),obj:o}); });
    Object.entries(d.lohn||{}).forEach(([k,o])=>ops.push(...lohnOps(k,o)));
    Object.entries(d.frozen||{}).forEach(([k,o])=>{ if(!S.frozen[k]) ops.push(...freezeOps(k,o)); });
    if(d.settings&&d.settings.kats) ops.push({col:'settings',id:'main',obj:{...S.settings,...d.settings}});
    if(!ops.length){ toast('Nichts zu importieren'); return; }
    await backend.batch(ops); logEv('Import',ops.length+' Einträge aus Datei importiert'); toast(ops.length+' Einträge importiert');
  }catch(e){ toast('Datei konnte nicht gelesen werden'); }
}
async function refreezeMonth(k){
  const l=lohnBase(k);
  await backend.batch(freezeOps(k,{key:k,items:liveItems(k),lohnN:l.n,lohnV:l.v,at:Date.now()}));
  logEv('Neu berechnet',label(k)+' aus den laufenden Einträgen neu gebildet');
  toast(label(k)+' neu berechnet');
}
async function saveLohn(k,p,val){
  if(p==='n' && !isAdmin()) return;
  if(!isAdmin() && S.frozen[k]) return;
  if(!(val===''||val==null||isNaN(val))) val=r05(val);
  const empty = val===''||val==null||isNaN(val);
  const old=(S.lohn[k]||{})[p];
  const col = p==='n'?'lohn':'lohnV';
  if(empty) await backend.del(col,String(k)); else await backend.set(col,String(k),p==='n'?{n:val}:{v:val});
  logEv('Lohn',`${label(k)} ${p==='n'?'Nicola':'Vanessa'}: ${old==null||old===''?'–':fmt(+old)} → ${empty?'leer (Vormonat)':fmt(val)}`);
  if(!isAdmin()) return;
  // eingefrorene Monate ab k mit neuen Lohnwerten nachziehen
  setTimeout(async()=>{
    const ops=[]; Object.keys(S.frozen).map(Number).filter(x=>x>=k).forEach(x=>{
      const l=lohnBase(x), fr=S.frozen[x]; if(fr.lohnN!==l.n||fr.lohnV!==l.v) ops.push(...freezeOps(x,{...fr,lohnN:l.n,lohnV:l.v}));
    });
    if(ops.length) await backend.batch(ops);
  },200);
}


async function startBackend(){
  backend.onReady=async()=>{ ready=true; ui.phase='app'; await migrate(); await autoFreeze(); render(); };
  await backend.start(onData, err=>{
    if(err.code==='permission-denied'){ ui.phase='denied'; render(); }
    else { ui.err='Fehler: '+(err.code||err.message); render(); }
  });
}
async function boot(){
  render();
  let cfg=null;
  try{ cfg=JSON.parse(lsGet('budget_fbconfig','null')); }catch{ cfg=null; }
  if(!cfg && FIREBASE_CONFIG.apiKey && FIREBASE_CONFIG.projectId) cfg=FIREBASE_CONFIG;
  const mode=lsGet('budget_mode');
  if(mode==='local'){ backend=LocalBackend(); ui.phase='loading'; await startBackend(); return; }
  if(!cfg){ ui.phase='setup'; render(); return; }
  try{
    ui.phase='loading'; ui.err=''; render();
    backend=await FirebaseBackend(cfg);
    backend.onAuth(async u=>{
      ui.user=u;
      if(!u){ ui.phase='login'; ready=false; render(); return; }
      ui.phase='loading'; render();
      await startBackend();
    });
  }catch(e){ ui.phase='setup'; ui.err='Verbindung fehlgeschlagen: '+(e.code||e.message); render(); }
}
/* ============ Export (CSV / PDF) ============ */
function reportData(period, sc){
  const adm=isAdmin(); if(!adm) sc='VS';
  const who=scopeLabel[sc], num=n=>Math.round(n*100)/100;
  const secs=[]; let title, sub;
  const agg=(mds)=>{
    const m={};
    mds.forEach(md=>md.items.forEach(it=>{
      if(it.art==='Ausgleich') return; const a=itemAmt(it,sc); if(a<=0.004) return;
      const k=[it.kat,it.name,it.art,it.wer].join('|'); (m[k]=m[k]||{kat:it.kat,name:it.name,art:it.art,wer:it.wer,sum:0}).sum+=a;
    }));
    return Object.values(m).sort((a,b)=>cats().concat(['Lohn']).indexOf(a.kat)-cats().concat(['Lohn']).indexOf(b.kat) || b.sum-a.sum);
  };
  if(period==='year'){
    const y=ui.year, rows=yearData(y), mds=rows.map(r=>monthData(r.k));
    title=`Haushaltsbudget ${y}`; sub=who;
    const P=r=>pick(r.c,sc);
    const tot=f=>rows.reduce((a,r)=>a+P(r)[f],0);
    secs.push({title:'Monatsübersicht (CHF)', head:['Monat','Einnahmen','Monatliche Ausgaben','Einkaufskonto','Jahreskonto','Sparen'],
      rows:rows.map(r=>[MONTHS[r.m-1]+(r.frozen?'':' (geplant)'),P(r).ein,P(r).mo,P(r).ek,P(r).steuer,P(r).spar].map((v,i)=>i?num(v):v)),
      foot:['Total',...['ein','mo','ek','steuer','spar'].map(f=>num(tot(f)))]});
    const ct={}; mds.forEach(md=>{ const c=calc(md); Object.entries(c.cat).forEach(([k,o])=>ct[k]=(ct[k]||0)+(sc==='NJ'?o.n:sc==='VS'?o.v:o.n+o.v)); });
    const cr=Object.entries(ct).filter(([,v])=>v>0.004).sort((a,b)=>b[1]-a[1]);
    secs.push({title:'Ausgaben nach Kategorie (inkl. Jahreskonto-Anteil)', head:['Kategorie','CHF'], rows:cr.map(([k,v])=>[k,num(v)]), foot:['Total',num(cr.reduce((a,[,v])=>a+v,0))]});
    const pos=agg(mds);
    secs.push({title:'Positionen im Jahr', head:['Kategorie','Beschreibung','Art','Wer','CHF im Jahr'], rows:pos.map(p=>[p.kat,p.name,p.art==='Lohn'?'Einnahme':p.art,WERN[p.wer],num(p.sum)])});
  } else {
    const k=ui.key, md=monthData(k), c=calc(md), P=pick(c,sc);
    title=`Haushaltsbudget ${label(k)}`; sub=who+(md.frozen?' · eingefroren':' · laufend berechnet');
    secs.push({title:'Übersicht (CHF)', head:['Position','CHF'], rows:[['Einnahmen',P.ein],['Monatliche Ausgaben',P.mo],['Einkaufskonto',P.ek],['Buchung ins Jahreskonto (Jahreskosten ÷ 12)',P.steuer],['Sparen',P.spar]].map(([a,b])=>[a,num(b)])});
    const pos=agg([md]);
    secs.push({title:'Positionen', head:['Kategorie','Beschreibung','Art','Wer','CHF im Monat'], rows:pos.map(p=>[p.kat,p.name,p.art==='Lohn'?'Einnahme':p.art,WERN[p.wer],num(p.sum)])});
  }
  return {title,sub,secs};
}
function reportCsv(r){
  const q=v=>{ const t=String(v); return /[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t; };
  const out=[r.title+' · '+r.sub+' · erstellt '+new Date().toLocaleDateString('de-CH'),''];
  r.secs.forEach(s=>{ out.push(q(s.title)); out.push(s.head.map(q).join(';')); s.rows.forEach(x=>out.push(x.map(q).join(';'))); if(s.foot) out.push(s.foot.map(q).join(';')); out.push(''); });
  return '﻿'+out.join('\r\n');
}
function reportHtml(r){
  const cell=(v,h)=>`<${h?'th':'td'} ${typeof v==='number'?'class="r"':''}>${typeof v==='number'?fmt(v):esc(v)}</${h?'th':'td'}>`;
  return `<h1>${esc(r.title)}</h1><p class="sub">${esc(r.sub)} · erstellt ${new Date().toLocaleDateString('de-CH')}</p>`+
    r.secs.map(s=>`<h2>${esc(s.title)}</h2><table><tr>${s.head.map(h=>`<th ${/CHF|Einn|Ausg|Steuer|Spar/.test(h)&&h!=='Position'?'class="r"':''}>${esc(h)}</th>`).join('')}</tr>${s.rows.map(x=>`<tr>${x.map(v=>cell(v)).join('')}</tr>`).join('')}${s.foot?`<tr class="tot">${s.foot.map(v=>cell(v)).join('')}</tr>`:''}</table>`).join('');
}
function openExport(){
  const adm=isAdmin(), m=$('#modal');
  m.innerHTML=`<div class="sheet"><h3>Export</h3>
   <div class="two-c"><label class="f">Zeitraum<select id="xp"><option value="year">Jahr ${ui.year}</option><option value="month">Monat ${label(ui.key)}</option></select></label>
   ${adm?`<label class="f">Person<select id="xs">${[['all','Haushalt'],['NJ','Nicola'],['VS','Vanessa']].map(([v,l])=>`<option value="${v}" ${ui.scope===v?'selected':''}>${l}</option>`).join('')}</select></label>`:'<label class="f">Person<select disabled><option>Vanessa</option></select></label>'}</div>
   <div class="hint">Excel öffnet die CSV-Datei direkt. Für ein PDF im Druckdialog «Als PDF speichern» wählen.</div>
   <div class="actions"><button class="btn grow" type="button" data-xcsv>Excel (CSV)</button><button class="btn grow" type="button" data-xpdf>PDF / Drucken</button><button class="btn sec" type="button" data-close>Abbrechen</button></div></div>`;
  m.classList.add('on');
  const get=()=>reportData($('#xp').value, adm?$('#xs').value:'VS');
  $('[data-close]',m).onclick=closeModal;
  $('[data-xcsv]',m).onclick=()=>{
    const r=get(); const a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([reportCsv(r)],{type:'text/csv;charset=utf-8'}));
    a.download=r.title.replace(/\s+/g,'_')+'_'+r.sub.split(' ')[0]+'.csv'; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href),2000);
    logEv('Export','CSV: '+r.title+' · '+r.sub); closeModal(); toast('CSV erstellt');
  };
  $('[data-xpdf]',m).onclick=()=>{
    const r=get(); let p=$('#print'); if(!p){ p=document.createElement('div'); p.id='print'; document.body.appendChild(p); }
    p.innerHTML=reportHtml(r); const old=document.title; document.title=r.title+' '+r.sub;
    logEv('Export','PDF: '+r.title+' · '+r.sub); closeModal();
    setTimeout(()=>{ window.print(); document.title=old; },80);
  };
}
