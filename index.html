<html lang="de-CH"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jundt – Rechnungen & Umsatz</title><style>:root{--bg:#f4f6f3;--card:#fff;--ink:#1c2a1f;--muted:#6b7280;--line:#dfe5dc;--green:#2e6b34;--green2:#3f8a47;--soft:#e6f0e3;--soft2:#f3f7f1;--red:#c0392b;--redsoft:#fbe9e6;--amber:#9a6100;--ambersoft:#fff2cc;--blue:#1f5fa8;--bluesoft:#e3eefa;--sal:#e07b6a;--lg:#9cc48f;--shadow:0 1px 2px rgba(20,40,20,.06),0 4px 14px rgba(20,40,20,.05)}

*{box-sizing:border-box}html,body{margin:0}body{font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--green)}button{font:inherit;cursor:pointer}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
#nav{background:var(--card);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}.brand img{width:38px;height:38px;object-fit:contain}.brand b{display:block;font-size:15px}.brand span{font-size:11px;color:var(--muted)}

#nav .sp{flex:1}#nav .foot{font-size:11px;color:var(--muted);padding:8px}
main{padding:24px 28px 60px;max-width:1280px;width:100%}
h1{font-size:24px;margin:0 0 4px;color:var(--green)}.sub{color:var(--muted);margin:0 0 18px}
h2{font-size:15px;margin:0 0 12px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g6{grid-template-columns:repeat(6,1fr)}
.kpi{padding:14px 16px}.kpi .l{font-size:11px;letter-spacing:.05em;color:var(--muted);font-weight:700;text-transform:uppercase}.kpi .v{font-size:22px;font-weight:800;margin:4px 0 2px;white-space:nowrap}.kpi .d{font-size:12px;color:var(--muted)}
.up{color:var(--green)}.down{color:var(--red)}

.r{text-align:right;font-variant-numeric:tabular-nums}.c{text-align:center}.mut{color:var(--muted)}.neg{color:var(--red)}
tr.sel td{background:var(--ambersoft);font-weight:700}
.tw{overflow-x:auto}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 12px;border-radius:9px;font-weight:600}.btn:hover{background:var(--soft2)}
.btn.p{background:var(--green);border-color:var(--green);color:#fff}.btn.p:hover{filter:brightness(1.08)}.btn.d{color:var(--red)}.btn.s{padding:4px 9px;font-size:12px;border-radius:7px}

.chip.entwurf{background:var(--soft2);color:var(--muted);border:1px solid var(--line)}.chip.offen{background:var(--bluesoft);color:var(--blue)}.chip.ueberfaellig{background:var(--redsoft);color:var(--red)}.chip.bezahlt{background:var(--soft);color:var(--green)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 9px;width:100%}
input:focus,select:focus,textarea:focus{outline:2px solid var(--green2);outline-offset:-1px}
label.f{display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}label.f>*:not(span){margin-top:4px;text-transform:none;letter-spacing:0;font-weight:400}
.fr{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select{width:auto;min-width:130px}.toolbar .grow{flex:1;min-width:180px}
.bars .row{display:grid;grid-template-columns:120px 1fr 90px;gap:10px;align-items:center;padding:5px 0}.bars .b{height:14px;border-radius:7px;background:var(--soft2);overflow:hidden}.bars .b i{display:block;height:100%;background:var(--green);border-radius:7px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px}
svg text{font-family:inherit;fill:var(--muted);font-size:11px}

.mh{display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}.mh h2{margin:0;font-size:17px}.mb{padding:18px 20px}.mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;align-items:center}
.lines input,.lines select{padding:5px 7px}.lines td{padding:4px 4px;border:0}.lines th{padding:4px;background:none;border:0}
.sumbox{margin-left:auto;max-width:340px;background:var(--soft2);border-radius:10px;padding:10px 14px}.sumbox div{display:flex;justify-content:space-between;gap:16px;padding:2px 0}.sumbox .t{font-weight:800;font-size:16px;border-top:1px solid var(--line);margin-top:4px;padding-top:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;opacity:0;pointer-events:none;transition:.25s;z-index:99}#toast.on{opacity:1}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* ---- Rechnung ---- */
.inv-wrap{padding:14px}.inv-hint{font-size:12px;color:var(--muted);text-align:center;margin:0 0 10px}
.sheet{--c1:#33463c;--c2:#aec4b8;display:flex;flex-direction:column;background:#fff;color:#111;width:210mm;min-height:297mm;margin:0 auto;padding:0;box-shadow:0 4px 24px rgba(0,0,0,.2);font-family:Arial,Helvetica,sans-serif;font-size:10pt;position:relative}

.sheet .tt img{position:absolute;right:8mm;top:3.5mm;height:10mm}
.sheet .in{padding:0 14mm 8mm;flex:1}
.sheet .head{display:grid;grid-template-columns:1fr 34mm 62mm;gap:6mm;align-items:start;margin-top:8mm}

.sheet .snd b{font-size:11pt}.sheet .snd{line-height:1.5}
.sheet .meta div{display:flex;justify-content:space-between;gap:6mm;line-height:1.6}.sheet .meta b{font-weight:700}
.sheet .addr{display:grid;grid-template-columns:1fr 1fr;gap:6mm;margin-top:9mm}
.sheet .addr h4,.sheet .bar{margin:0 0 2mm;font-size:11pt;background:var(--c2);padding:1.6mm 2.5mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .addr p{margin:0;padding:0 2.5mm;line-height:1.5;white-space:pre-line}
.sheet table.l{margin-top:9mm;font-size:9.5pt}.sheet table.l th{background:var(--c2);color:#111;text-transform:none;font-size:9.5pt;letter-spacing:0;padding:1.6mm 2mm;border:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet table.l td{border:0;padding:1.4mm 2mm;background:none!important;vertical-align:top}.sheet table.l tr{break-inside:avoid}
.sheet table.l tr.g td{background:#d9d9d9!important;font-weight:700;font-size:11pt;text-align:center;padding:1.2mm;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet table.l tr.s td{background:#ff9a9a!important;font-weight:700;font-style:italic;border-top:.3mm solid #999;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .foot{display:grid;grid-template-columns:1fr 78mm;gap:8mm;margin-top:10mm;align-items:end;break-inside:avoid}
.sheet .pay{line-height:1.55;font-size:9.5pt}.sheet .sig{display:block;height:13mm;margin:0 0 1mm auto}
.sheet .tot{display:flex;justify-content:space-between;align-items:center;background:var(--c2);padding:3mm 3mm;font-weight:700;font-size:12pt;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .rund{display:flex;justify-content:space-between;font-size:9pt;color:#555;padding:0 3mm 1.5mm}
@media (max-width:900px){#app{grid-template-columns:1fr}#nav{position:static;height:auto;flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line)}#nav .sp,#nav .foot,.brand span{display:none}.brand{padding:0 8px}main{padding:16px 14px 50px}.g2,.g3{grid-template-columns:1fr}.g6{grid-template-columns:1fr 1fr}.sheet{transform-origin:top left}}
@media print{@page{size:A4;margin:0}html,body{background:#fff!important}body>*:not(#print-root){display:none!important}#print-root{display:block!important}#print-root .sheet{box-shadow:none;margin:0;width:210mm;zoom:1}}
#print-root{display:none}
/* Assistent */
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:5px;border-radius:3px;background:var(--line)}.steps i.on{background:var(--green)}
.gcards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gcard{border:2px solid var(--line);border-radius:14px;background:var(--card);padding:16px 14px;display:flex;align-items:center;gap:12px;text-align:left;color:var(--ink);font-weight:700;font-size:15px}.gcard:hover{border-color:var(--green);background:var(--soft2)}.gcard .ic{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none}.gcard .ic img{width:24px;height:24px}.gcard small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.nrbig{font-size:34px;font-weight:800;letter-spacing:.04em;color:var(--green);text-align:center;margin:10px 0 4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}.seg button{border:0;background:var(--card);color:var(--ink);padding:5px 12px;font-weight:600}.seg button.on{background:var(--green);color:#fff}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.pill{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 13px;border-radius:99px;font-weight:600}.pill:hover{background:var(--soft2)}.pill.on{background:var(--green);border-color:var(--green);color:#fff}.pill i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.bars .row.click{cursor:pointer;border-radius:8px}.bars .row.click:hover{background:var(--soft2)}.bars .row.on{background:var(--soft)}
.bg .hit{fill:transparent;cursor:pointer}.bg:hover .hit{fill:var(--soft2)}
#tip{position:fixed;z-index:200;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:8px;font-size:12px;pointer-events:none;opacity:0;white-space:pre;transition:opacity .1s}#tip.on{opacity:1}
tr.clk{cursor:pointer}
.todo{display:flex;align-items:center;gap:10px;padding:8px 4px;border-bottom:1px solid var(--line);cursor:pointer}.todo:hover{background:var(--soft2)}.todo .m{flex:1;min-width:0}.todo .m b,.todo .m span{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.todo .m span{font-size:12px;color:var(--muted)}
/* Projektseite */
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 520px;gap:16px;align-items:start}.pright{position:sticky;top:14px}.pv{zoom:.62;border:1px solid var(--line);margin:0 auto;width:210mm;pointer-events:none}.pvw{overflow:hidden;display:flex;justify-content:center}
.pl .card{margin-bottom:14px}.pl h2{display:flex;justify-content:space-between;align-items:center}
.wk td{vertical-align:top}.wk textarea{min-height:56px;resize:vertical}.wk input,.wk textarea{padding:6px 8px}.wk td{padding:4px 5px;border:0}.wk th{padding:4px 5px;background:none;border:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chipb{border:1px dashed var(--green);background:var(--soft2);color:var(--green);padding:5px 11px;border-radius:99px;font-weight:600}.chipb:hover{background:var(--soft)}
.radio{display:flex;gap:16px;margin:4px 0 8px}.radio label{display:flex;gap:6px;align-items:center;font-weight:400;text-transform:none;font-size:14px;color:var(--ink);letter-spacing:0;margin:0}.radio input{width:auto}
@media (max-width:1180px){.pgrid{grid-template-columns:1fr}.pright{position:static}.pv{zoom:.7}}
/* Zahlteil */
.zt{position:relative;display:flex;height:105mm;border-top:.25mm dashed #000;font-family:Arial,Helvetica,sans-serif;color:#000;flex:none;margin-top:auto}
.zt::before{content:'✂';position:absolute;top:-3.4mm;left:10mm;font-size:9pt;line-height:1;background:#fff;padding:0 1mm}
.zt .rc{width:62mm;padding:5mm;border-right:.25mm dashed #000;display:flex;flex-direction:column}
.zt .pt{flex:1;padding:5mm;display:grid;grid-template-columns:51mm 1fr;column-gap:5mm}
.zt h5{margin:0 0 3mm;font-size:11pt;font-weight:700}.zt .lb{font-size:6pt;font-weight:700;margin:3mm 0 .8mm;line-height:9pt}
.zt .v{font-size:8pt;line-height:9pt}.zt .pt .v{font-size:10pt;line-height:11pt}.zt .pt .lb{font-size:8pt;line-height:11pt}
.zt .qr{width:46mm;height:46mm;margin:5mm 0 0}.zt .wb{display:flex;gap:6mm;margin-top:auto}.zt .wb div{display:block}
.zt .rc .wb{margin-top:auto}.zt .annahme{text-align:right;font-size:6pt;font-weight:700;margin-top:2mm}
.zt svg.bx{display:block}
table.kt{width:100%;border-collapse:collapse;font-size:13px}table.kt td{padding:4px 8px;border-bottom:1px solid var(--line)}table.kt tr.b td{font-weight:700;background:var(--soft2)}table.kt tr.red td{background:#ff9a9a;font-weight:700}table.kt tr.ang td{background:var(--green);color:#fff;font-weight:800;font-size:15px}
.druck{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;background:var(--soft2)}.dh{display:flex;gap:8px;align-items:center;margin-bottom:10px}.mins{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end;margin-bottom:8px}.mi{display:flex;flex-direction:column;font-size:11px;color:var(--mut);font-weight:600}.mi input{width:78px}.dres{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;border-top:1px solid var(--line);padding-top:8px}
/* ===== Polish v5 ===== */
:root{--ease:cubic-bezier(.2,.7,.2,1)}
.tw{scrollbar-width:thin;scrollbar-color:var(--line) transparent}.tw::-webkit-scrollbar{height:8px}.tw::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}.tw::-webkit-scrollbar-track{background:transparent}
table.wk{width:100%}.wk input,.wk select,.wk textarea{width:100%!important;min-width:0}.wk th{min-width:0!important}
@media(max-width:640px){
 table.wk,table.wk tbody{display:block;width:100%}table.wk tr:first-child{display:none}
 table.wk tr{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
 table.wk td{display:block;padding:0}table.wk td::before{content:attr(data-h);display:block;font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;margin-bottom:2px}
 table.wk td[data-h=""]::before,table.wk td.empty::before{display:none}table.wk td[data-full],table.wk td[colspan]{grid-column:1/-1}
 table.wk td.r{text-align:left}
}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes growx{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes growy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
#view.anim>*{animation:up .45s var(--ease) both}#view.anim>*:nth-child(2){animation-delay:.05s}#view.anim>*:nth-child(3){animation-delay:.1s}#view.anim>*:nth-child(4){animation-delay:.15s}#view.anim>*:nth-child(5){animation-delay:.2s}#view.anim>*:nth-child(n+6){animation-delay:.25s}
#view.anim .grid>.card,#view.anim .pl>.card,#view.anim .pright{animation:up .5s var(--ease) both}#view.anim .grid>.card:nth-child(2){animation-delay:.08s}#view.anim .grid>.card:nth-child(3){animation-delay:.16s}#view.anim .grid>.card:nth-child(4){animation-delay:.24s}
.modal{animation:pop .28s var(--ease)}.modal-bg{animation:fade .2s}
.bars .b i{transform-origin:left;animation:growx .8s var(--ease) both}
#view svg rect[rx="3"]{transform-box:fill-box;transform-origin:bottom;animation:growy .7s var(--ease) both}
.btn{transition:transform .15s var(--ease),box-shadow .15s,background .15s,filter .15s}.btn:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.08)}.btn:active{transform:scale(.97)}
.card{border-radius:16px;transition:box-shadow .2s,transform .2s}.card.kpi:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.08)}
#toast{transform:translate(-50%,12px);transition:.3s var(--ease)}#toast.on{transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
h1{letter-spacing:-.01em}
/* Projekte */
.stiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.stile{display:grid;grid-template-columns:auto 1fr;grid-template-areas:"ic n" "l l" "s s";align-items:center;gap:2px 10px;text-align:left;padding:14px 16px;border:1px solid var(--line);background:var(--card);border-radius:16px;box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s;color:var(--ink)}
.stile:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(0,0,0,.09)}.stile.on{border-color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.stile .ic{grid-area:ic;font-size:22px}.stile .n{grid-area:n;font-size:28px;font-weight:800;text-align:right}.stile .l{grid-area:l;font-weight:700}.stile small{grid-area:s;color:var(--muted);font-size:12px}
.stile.warn{border-color:var(--red)}.stile.muted{opacity:.75}
.plist .sec{margin-bottom:18px}.plist .sec h3{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 8px;font-size:15px}.plist .sec h3 span{font-size:12px;font-weight:600;color:var(--muted)}
.prow{display:grid;grid-template-columns:10px 1fr auto auto auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:6px;cursor:pointer;transition:transform .15s var(--ease),box-shadow .15s,border-color .15s}
.prow:hover{transform:translateX(3px);box-shadow:0 4px 14px rgba(0,0,0,.08);border-color:var(--green)}
.prow .dot{width:10px;height:10px;border-radius:50%}.prow .m{min-width:0}.prow .m b,.prow .m span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.prow .m span{font-size:12px;color:var(--muted)}
.prow .w{text-align:right}.prow .w small{display:block;font-size:11px;color:var(--muted);margin-top:2px}.prow .amt{min-width:70px;text-align:right}.prow .ac{display:flex;gap:6px;min-width:100px;justify-content:flex-end}
.prow.ueberfaellig{border-left:4px solid var(--red)}.sec.red h3{color:var(--red)}
@media(max-width:700px){.prow{grid-template-columns:10px 1fr auto;grid-template-areas:"d m a" "d w c"}.prow .dot{grid-area:d}.prow .m{grid-area:m}.prow .amt{grid-area:a}.prow .w{grid-area:w;text-align:left}.prow .ac{grid-area:c}}
.donebtn{width:100%;padding:12px;border:1px dashed var(--line);background:transparent;border-radius:12px;color:var(--muted);font-weight:600}.donebtn:hover{background:var(--soft2);color:var(--ink)}
.empty.big{font-size:18px;padding:40px 10px;text-align:center}
.chip.offerte{background:var(--ambersoft);color:var(--amber)}.chip.abgelehnt{background:var(--soft2);color:var(--muted);text-decoration:line-through}
/* Einstellungen */
.stabs{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:16px}
.stab{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 8px;border:1px solid var(--line);background:var(--card);border-radius:14px;font-weight:600;color:var(--ink);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.stab span{font-size:24px}.stab:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(0,0,0,.08)}.stab.on{border-color:var(--green);background:var(--soft);color:var(--green);box-shadow:0 0 0 2px var(--green) inset}
.hic{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:var(--soft);margin-right:8px;font-size:16px}
@media (max-width:900px){#app{grid-template-columns:minmax(0,1fr)}main{padding:16px 14px 60px}}
main,.pl,.pright,.pgrid>*,.card{min-width:0}.fr{grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
@media (max-width:1180px){.pgrid{grid-template-columns:minmax(0,1fr)}.pv{zoom:.5}}.pvw{max-width:100%;overflow:auto}
.top>div:last-child{display:flex;gap:8px;flex-wrap:wrap}
/* Login */
body.locked #app{display:none}
#login{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(circle at 30% 20%,var(--soft),var(--bg) 60%);z-index:200;animation:fade .3s}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:28px 26px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.18);text-align:center;animation:pop .4s var(--ease)}
.lcard h1{margin:6px 0 2px;font-size:22px}.lcard .f{text-align:left}.lic{font-size:40px}.lerr{background:var(--redsoft);color:var(--red);padding:8px 10px;border-radius:9px;margin:0 0 12px;font-size:13px}.linfo{background:var(--soft);color:var(--green);padding:8px 10px;border-radius:9px;margin:0 0 12px;font-size:13px}
.lnk{background:none;border:0;color:var(--green);margin-top:12px;font-size:13px;text-decoration:underline}
</style></head>

const dd=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);

function homeSub(){const c=s=>S.projekte.filter(p=>status(p)===s),ue=c('ueberfaellig'),of=c('offen'),oq=c('offerte'),ar=c('entwurf'),sm=a=>a.reduce((x,p)=>x+betrag(p),0),T=[];

function vProjekte(){

  const ueb=P.filter(p=>status(p)==='ueberfaellig').length,grpOf=s=>s==='ueberfaellig'||s==='offen'?'unbezahlt':s==='bezahlt'||s==='abgelehnt'?'done':s;

    if(ui.q){const t=(p.nr+' '+kname(p)+' '+p.titel+' '+(p.notiz||'')).toLowerCase();if(!t.includes(ui.q.toLowerCase()))return false}return true});

    body=L.length?`<div class="sec"><h3>${names[st]||'Alle Projekte'}<span>${L.length} · ${chf(L.reduce((a,p)=>a+betrag(p),0))}</span></h3>${L.slice(0,st==='done'||!st?150:999).map(pRow).join('')}</div>`:'<div class="empty big">Keine Projekte gefunden.</div>'}

  <div class="stiles">${tile('offerte','📨','Offerten',T.offerte,chf(T.offerte.v)+' offen','')}${tile('entwurf','🛠️','In Arbeit',T.entwurf,chf(T.entwurf.v)+' noch zu verrechnen','')}${tile('unbezahlt','⏳','Wartet auf Zahlung',T.unbezahlt,chf(T.unbezahlt.v)+(ueb?` · <b class="down">${ueb} überfällig</b>`:''),ueb?'warn':'')}${tile('done','✅','Erledigt',T.done,chf(T.done.v)+' total','muted')}</div>
  <div class="toolbar"><input class="grow" id="q" placeholder="🔍 Suchen (Kunde, Nr., Projekt …)" value="${esc(ui.q)}">
   <select id="fyr"><option value="">Alle Jahre</option>${ys.map(y=>`<option ${ui.yr==y?'selected':''}>${y}</option>`).join('')}</select>
   <select id="fgw"><option value="">Alle Gewerke</option>${S.gewerke.map(g=>`<option value="${g.id}" ${ui.gw===g.id?'selected':''}>${esc(g.name)}</option>`).join('')}</select>
   <button class="pill ${ui.st==='alle'?'on':''}" data-act="st" data-v="${ui.st==='alle'?'':'alle'}">Alle zeigen</button>
   ${ui.mo?`<button class="pill on" data-act="clrmo">Monat: ${MONATE[ui.mo-1]} ✕</button>`:''}</div>
  <div class="plist">${body}</div>`}

function parseStreet(s){const m=String(s||'').trim().match(/^(.*?)\s+(\d+[a-zA-Z]?(?:\s?[-/]\s?\d+[a-zA-Z]?)?)$/);return m?{s:m[1],n:m[2]}:{s:String(s||'').trim(),n:''}}
function parseOrt(s){const m=String(s||'').trim().match(/^(\d{4})\s+(.+)$/);return m?{z:m[1],o:m[2]}:null}
const cl=(s,n)=>String(s||'').replace(/[\r\n]+/g,' ').trim().slice(0,n);
function qrPayload(p){
  const A=S.settings.absender,k=kd(p.kundeId),b=betrag(p),cs=parseStreet(A.strasse),co=parseOrt(A.ort)||{z:'',o:A.ort};
  const ds=k?parseStreet(k.strasse):null,dor=k?parseOrt(k.ort):null,okD=k&&k.name&&ds&&ds.s&&dor;
  const L=['SPC','0200','1',String(A.iban||'').replace(/\s+/g,''),'S',cl(A.kontoinhaber||A.name,70),cl(cs.s,70),cl(cs.n,16),cl(co.z,16),cl(co.o,35),'CH','','','','','','','',
    b>0?b.toFixed(2):'','CHF',...(okD?['S',cl(k.name,70),cl(ds.s,70),cl(ds.n,16),dor.z,cl(dor.o,35),'CH']:['','','','','','','']),'NON','',cl('Rechnung '+(p.nr||''),140),'EPD'];
  return L.join('\n')}
function qrSVG(text){
  const q=QR.encode(Array.from(new TextEncoder().encode(text))),n=q.size,u=n/46;let d='';
  for(let y=0;y<n;y++)for(let x=0;x<n;x++)if(q.get(x,y))d+=`M${x} ${y}h1v1h-1z`;
  const c=n/2,w=7*u,bl=6*u,al=3.7*u,at=1.2*u;
  return`<svg class="qr" viewBox="0 0 ${n} ${n}" shape-rendering="crispEdges"><rect width="${n}" height="${n}" fill="#fff"/><path d="${d}" fill="#000"/><rect x="${c-w/2}" y="${c-w/2}" width="${w}" height="${w}" fill="#fff"/><rect x="${c-bl/2}" y="${c-bl/2}" width="${bl}" height="${bl}" fill="#000"/><rect x="${c-at/2}" y="${c-al/2}" width="${at}" height="${al}" fill="#fff"/><rect x="${c-al/2}" y="${c-at/2}" width="${al}" height="${at}" fill="#fff"/></svg>`}
const bxs=(w,h)=>`<svg class="bx" width="${w}mm" height="${h}mm" viewBox="0 0 ${w} ${h}"><path d="M0 3V0h3M${w-3} 0h3v3M0 ${h-3}v3h3M${w-3} ${h}h3v-3" fill="none" stroke="#000" stroke-width=".3"/></svg>`;

const hm=s=>{s=String(s==null?'':s).trim();if(!s)return 0;if(s.includes(':')){const[a,b]=s.split(':');return(+a||0)+(+b||0)/60}return+s.replace(',','.')||0};
const fkg=f=>f&&+f.preis>0?(+f.preis)/(+f.kg||1):0;
const VOR=['CAD','Slicing','Material wechseln','Transfer & Start'],NACH=['Druckbett bereinigen','Support bereinigen','Zusatz bearbeiten'];
const newDruck=()=>({t:'',drucker:(S.d3.drucker[0]||{}).name||'',fil:[{f:'',g:''}],zeit:'',vor:[0,0,0,0],nach:[0,0,0],verbrauch:0,ang:''});
const newCalc=()=>({marge:S.d3.marge,drucke:[newDruck()]});
function calcOne(c,marge){
  const D=S.d3,dr=D.drucker.find(x=>x.name===c.drucker)||{},h=hm(c.zeit);let gram=0,fil=0,len=0;
  (c.fil||[]).forEach(r=>{const f=D.filament.find(x=>x.name===r.f),g=+r.g||0;gram+=g;if(f){fil+=g/1000*fkg(f);const d=+f.dichte,dm=+f.dm||1.75;if(d)len+=g/(d*Math.PI*Math.pow(dm/20,2))/100}});
  const sum=a=>(a||[]).reduce((x,v)=>x+(+v||0),0),strom=(+dr.kwh||0)*h*(+D.energie||0),dru=(+dr.abschr||0)*h,
    vor=sum(c.vor)/60*(+D.arbeit||0),nach=sum(c.nach)/60*(+D.arbeit||0),ver=+c.verbrauch||0,zw=fil+strom+dru+vor+nach+ver,mf=zw*(1+(+D.fehler||0)/100),selbst=fil+strom+dru+ver,basis=mf*((+marge||0)/100),
    ang=(c.ang===''||c.ang==null)?r5(basis):+c.ang;
  return{h,gram,len,fil,strom,dru,vor,nach,ver,zw,mf,selbst,basis,ang}}
function calc3(P){
  const per=P.calc.drucke.map(d=>calcOne(d,P.calc.marge)),T={};
  ['fil','strom','dru','vor','nach','ver','zw','mf','selbst','basis','ang','gram'].forEach(k=>T[k]=per.reduce((a,x)=>a+x[k],0));T.per=per;return T}
function sync3(P){if(!P.calc)P.calc=newCalc();const k=calc3(P);

  else if(a==='dy'){ui.dy=t.dataset.v==='all'?'all':+t.dataset.v;render()}
  else if(a==='dg'){ui.dg=t.dataset.v;render()}
  else if(a==='chart'){ui.chart=t.dataset.v;render()}
  else if(a==='bar'){const i=+t.dataset.i;if(ui.dy!=='all'&&ui.chart==='monat'){ui.yr=String(ui.dy);ui.mo=i+1;ui.gw=ui.dg;ui.st='';ui.q='';location.hash='#/projekte'}else{const ys=ui._years;if(ys&&ys[i]){ui.dy=ys[i];render()}}}
  else if(a==='goopen'){ui.st='unbezahlt';ui.yr='';ui.mo='';ui.q='';ui.gw=ui.dg;location.hash='#/projekte'}
  else if(a==='kproj'){ui.q=t.dataset.v;ui.st='alle';ui.yr='';ui.mo='';ui.gw='';location.hash='#/projekte'}
  else if(a==='clrmo'){ui.mo='';render()}
  else if(a==='st'){ui.st=t.dataset.v;ui.yr='';ui.mo='';render()}
  else if(a==='offerte'){if(!p.kundeId){toast('Bitte zuerst einen Auftraggeber wählen');return}if(!p.offerteDatum){p.offerteDatum=today();p.offerteStatus='offen';save();render()}printInvoice(p,'offerte')}
  else if(a==='oyes'){p.offerteStatus='angenommen';save();render();toast('Offerte angenommen – ab in die Arbeit 💪')}
  else if(a==='ono'){p.offerteStatus='abgelehnt';save();render();toast('Offerte als abgelehnt markiert')}
  else if(a==='stab'){ui.stab=t.dataset.v;render()}
  else if(a==='addrow'){const v=t.dataset.v;if(v==='material')S.material.push({text:'',preis:0});else if(v==='drucker')S.d3.drucker.push({name:'Neuer Drucker',preis:0,zeit:'',service:0,kwh:0.6,abschr:0});else S.d3.filament.push({name:'Neues Filament',dm:1.75,preis:0,kg:1,dichte:1.24,duese:230,bett:60});save();render()}
  else if(a==='delrow'){const v=t.dataset.v,i=+t.dataset.i;if(await confirmBox('Eintrag löschen?','Löschen')){(v==='material'?S.material:S.d3[v]).splice(i,1);save();render()}}
  else if(a==='addfil3'){const P=curP();P.calc.drucke[+t.dataset.i].fil.push({f:'',g:''});save();render()}
  else if(a==='rmfil3'){const P=curP();P.calc.drucke[+t.dataset.i].fil.splice(+t.dataset.j,1);sync3(P);save();render()}
  else if(a==='adddruck'){const P=curP();P.calc.drucke.push(newDruck());sync3(P);save();render()}
  else if(a==='rmdruck'){const P=curP();P.calc.drucke.splice(+t.dataset.i,1);sync3(P);save();render()}
  else if(a==='newk')editKunde(null);
  else if(a==='editk')editKunde(id);
  else if(a==='projk')openWizard({kundeId:id});
  else if(a==='backup')backup();
  else if(a==='csv')exportCSV();
  else if(a==='restore')$('#rf').click();
  else if(a==='reset'){if(await confirmBox('Alle Änderungen verwerfen und mit den Ausgangsdaten (Excel-Stand) neu beginnen?','Zurücksetzen')){S=migrate(clone(SEED));save();render();toast('Zurückgesetzt')}}
  else if(a==='addgw'){S.gewerke.push({id:'g'+uid(),name:'Neues Gewerk',titel:'Rechnung',kuerzel:'',satz:80,admin:80,typ:'frei',farbe:'#2e6b34',hell:'#b9dca8'});save();render()}
  else if(a==='delgw'){const g=S.gewerke[+id];if(S.projekte.some(p=>p.gewerk===g.id))toast('Gewerk wird noch verwendet');else{S.gewerke.splice(+id,1);save();render()}}
});
document.addEventListener('change',e=>{const t=e.target;
  if(t.dataset.og!=null&&curP()){const P=curP();P.ortGleich=t.dataset.og==='1';save();render();return}
  if(t.dataset.act==='ortk'&&curP()){if(t.value){curP().ort=kAddr(kd(t.value));save();render()}return}
  if(t.dataset.mat&&curP()){const P=curP(),l=P.positionen[+t.dataset.l.split('.')[0]],m=S.material.find(x=>x.text===t.value);let re=false;if(m&&!(+l.preis)){l.preis=m.preis;re=true}save();projMatLearn(P);if(re)render();else projUpdate(P);return}
  if(projInput(e))return;
  if(t.id==='yr'){}
  else if(t.id==='fst'){ui.st=t.value;render()}else if(t.id==='fyr'){ui.yr=t.value;render()}else if(t.id==='fgw'){ui.gw=t.value;render()}
  else if(t.dataset.g){S.settings[t.dataset.g]=['tage','aufschlag','offerteTage'].includes(t.dataset.g)?+t.value:t.value;save();toast('Gespeichert')}
  else if(t.dataset.gc){S.settings[t.dataset.gc]=t.checked;save();toast('Gespeichert')}
  else if(t.id==='rf'){const f=t.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{try{const d=JSON.parse(r.result);if(!d.projekte||!d.kunden)throw 0;if(await confirmBox('Backup einlesen und aktuelle Daten ersetzen?','Einlesen')){S=migrate(d);save();render();toast('Backup eingelesen')}}catch(x){toast('Das ist kein gültiges Backup')}};r.readAsText(f)}});
document.addEventListener('input',e=>{const t=e.target;
  if(projInput(e))return;
  if(t.id==='q'){ui.q=t.value;const pos=t.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(pos,pos)}
  else if(t.id==='kq'){ui.kq=t.value;const pos=t.selectionStart;render();const n=$('#kq');n.focus();n.setSelectionRange(pos,pos)}
  else if(t.dataset.ar){const[r,i,f]=t.dataset.ar.split('.'),L=r==='material'?S.material:S.d3[r],o=L[+i];o[f]=t.type==='number'?(t.value===''?'':+t.value):t.value;save();
    if(r==='filament'){const c=$('#fk'+i);if(c)c.textContent=num(fkg(o))}if(r==='drucker'){const c=$('#dv'+i);if(c)c.textContent=+o.zeit?num(((+o.preis||0)+(+o.service||0))/+o.zeit):'–'}}
  else if(t.dataset.d3){S.d3[t.dataset.d3]=+t.value;save()}
  else if(t.dataset.s){S.settings.absender[t.dataset.s]=t.value;save()}
  else if(t.dataset.gw){const[i,k]=t.dataset.gw.split('.');S.gewerke[+i][k]=['satz','admin'].includes(k)?+t.value:t.value;save()}});
/* Tooltip */
const tip=()=>$('#tip');
document.addEventListener('mouseover',e=>{const t=e.target.closest('[data-tip]');if(t){tip().textContent=t.dataset.tip;tip().classList.add('on')}});
document.addEventListener('mousemove',e=>{const tp=tip();if(!tp.classList.contains('on'))return;tp.style.left=Math.min(e.clientX+14,innerWidth-tp.offsetWidth-8)+'px';tp.style.top=(e.clientY+14)+'px'});
document.addEventListener('mouseout',e=>{if(e.target.closest&&e.target.closest('[data-tip]')&&!(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest('[data-tip]')===e.target.closest('[data-tip]')))tip().classList.remove('on')});
/* ---------- Router ---------- */
const VIEWS={dashboard:['Übersicht','📊',vDashboard],projekte:['Projekte','🧾',vProjekte],kunden:['Kunden','👥',vKunden],settings:['Einstellungen','⚙️',vSettings]};
function render(){
  const h=(location.hash.replace('#/','')||'dashboard'),key=h.split('/')[0];
  const isP=key==='projekt',V=VIEWS[isP?'projekte':key]||VIEWS.dashboard;
  $('#nav').innerHTML=`<div class="brand"><img src="${LOGO}" alt=""><div><b>N. Jundt</b><span>Rechnungen & Umsatz</span></div></div>${Object.entries(VIEWS).map(([k,x])=>`<a class="nl ${V===x?'on':''}" href="#/${k}">${x[1]} ${x[0]}</a>`).join('')}<div class="sp"></div><div class="foot">${S.projekte.length} Projekte · ${S.kunden.length} Kunden</div>`;
  const sc=window.scrollY,vw=$('#view'),first=window._vk!==h;window._vk=h;vw.classList.toggle('anim',first);$('#view').innerHTML=isP?vProjekt(h.split('/')[1]):V[2]();
  if(isP){const P=curP();if(P)projUpdate(P)}
  $$('table.wk').forEach(t=>{const hs=[...t.querySelectorAll('tr:first-child th')].map(x=>x.textContent);t.querySelectorAll('tr').forEach((r,ri)=>{if(!ri)return;[...r.children].forEach((c,i)=>{if(c.tagName==='TD'){c.dataset.h=hs[i]||'';if(c.querySelector('textarea,input[list],input:not([type])'))c.dataset.full='1'}})})});
  tip().classList.remove('on');window.scrollTo(0,first?0:sc)}
window.addEventListener('hashchange',()=>{window.scrollTo(0,0);render()});
render();
</script></body></html>
